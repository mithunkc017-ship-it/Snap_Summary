<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapSummary AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <svg id="robot" class="robot" data-state="idle" viewBox="0 0 64 64" aria-hidden="true">
        <line class="stem" x1="32" y1="9" x2="32" y2="15"/>
        <circle class="antenna" cx="32" cy="6" r="3"/>
        <rect class="head" x="12" y="15" width="40" height="30" rx="10"/>
        <ellipse class="eye" cx="24" cy="30" rx="3.5" ry="4.5"/>
        <ellipse class="eye" cx="40" cy="30" rx="3.5" ry="4.5"/>
        <path class="mouth" d="M26 38 Q32 42 38 38"/>
        <rect class="body" x="20" y="47" width="24" height="12" rx="6"/>
        <rect class="arm" x="46" y="49" width="12" height="5" rx="2.5"/>
      </svg>
      <div class="hero-text">
        <h1>SnapSummary AI</h1>
        <p id="greeting">Hi, I'm Snap! Open a page and I'll summarize it for you.</p>
      </div>
    </header>

    <section class="card" aria-labelledby="styleLabel">
      <span id="styleLabel" class="label">Summary style</span>
      <div class="segmented" role="radiogroup" aria-labelledby="styleLabel">
        <label><input type="radio" name="style" value="Short" checked><span>Short</span></label>
        <label><input type="radio" name="style" value="Detailed"><span>Detailed</span></label>
        <label><input type="radio" name="style" value="Beginner Friendly"><span>Beginner</span></label>
      </div>

      <button id="summarizeBtn" class="primary" type="button">Summarize this page</button>
      <p class="hint">I only read the page when you click the button.</p>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section id="resultCard" class="card result-card" hidden>
      <div class="result-head">
        <span class="label">Summary</span>
        <button id="copyBtn" class="ghost" type="button">Copy</button>
      </div>
      <article id="result" class="result"></article>
    </section>

    <footer>SnapSummary AI</footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
